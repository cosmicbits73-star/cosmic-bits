name: Short automatico
on:
  schedule:
    - cron: "50 9,15,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cosmic-bits
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install google-genai edge-tts requests
      - run: python generate.py short
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - run: python voice.py short
      - run: python video.py short
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - name: Pubblica su YouTube
        run: python upload.py short public
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Salva storico argomenti
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add topics.json
          git commit -m "Aggiorna storico argomenti" || echo "niente da salvare"
          git pull --rebase
          git push
