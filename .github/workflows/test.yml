name: Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install google-genai edge-tts requests
      - run: python generate.py short
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - run: python voice.py
      - run: python video.py short
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - name: Salva storico argomenti
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add topics.json
          git commit -m "Aggiorna storico argomenti" || echo "niente da salvare"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: risultato
          path: |
            out.json
            video.mp4
